<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Walkie Texto - Mensajes con Sonido</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0f;
            font-family: system-ui, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #2c2c3e;
            border-radius: 40px;
            padding: 25px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 {
            color: #ff6b6b;
            text-align: center;
            margin: 0 0 5px;
            font-size: 1.8rem;
        }

        .subtitulo {
            text-align: center;
            color: #ffb347;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 16px;
            border: none;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input {
            background: #0a0a0f;
            border: 1px solid #3a3a4a;
            color: white;
            text-align: center;
        }

        button {
            background: #ff6b6b;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

        .id-box {
            background: #0a0a0f;
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            margin: 10px 0;
            color: #2ed573;
            font-size: 14px;
            font-weight: bold;
            word-break: break-all;
        }

        .conexion-info {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .conexion-info button {
            flex: 1;
            margin: 0;
        }

        .reset-btn {
            background: #7f8c8d;
        }

        /* CHAT - LETRAS GRANDES */
        .chat-container {
            background: #1e1e2a;
            border-radius: 24px;
            margin: 15px 0;
            overflow: hidden;
        }

        .chat-header {
            background: #0a0a0f;
            padding: 12px 15px;
            border-bottom: 1px solid #3a3a4a;
            color: #ffb347;
            font-size: 0.9rem;
            text-align: center;
            font-weight: bold;
        }

        .chat-mensajes {
            height: 380px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Estilo de mensajes - TAMAÑO GRANDE */
        .mensaje {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 1.2rem;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .mensaje-propio {
            background: #ff6b6b;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }

        .mensaje-otro {
            background: #3498db;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }

        .mensaje-info {
            background: #7f8c8d;
            color: white;
            align-self: center;
            font-size: 0.9rem;
            padding: 8px 14px;
            border-radius: 20px;
        }

        .mensaje-error {
            background: #e74c3c;
            color: white;
            align-self: center;
            font-size: 0.9rem;
            padding: 8px 14px;
            border-radius: 20px;
        }

        .mensaje-nombre {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .mensaje-hora {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 5px;
            text-align: right;
        }

        /* AREA DE TEXTO GRANDE */
        .input-area {
            display: flex;
            gap: 12px;
            padding: 15px;
            border-top: 1px solid #3a3a4a;
        }

        .input-area textarea {
            flex: 1;
            margin: 0;
            padding: 14px;
            background: #0a0a0f;
            border: 1px solid #3a3a4a;
            border-radius: 20px;
            color: white;
            font-size: 1.2rem;
            resize: none;
            font-family: system-ui;
            height: 60px;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: #2ed573;
        }

        .input-area button {
            width: 75px;
            margin: 0;
            background: #2ed573;
            font-size: 1.3rem;
            border-radius: 20px;
        }

        .info-wav {
            background: #0a0a0f;
            border-radius: 12px;
            padding: 10px;
            margin-top: 12px;
            font-size: 11px;
            text-align: center;
            color: #ffb347;
        }

        .estado-conexion {
            background: #1e1e2a;
            border-radius: 14px;
            padding: 10px;
            margin: 10px 0;
            font-size: 13px;
            text-align: center;
            color: #ffb347;
            font-weight: bold;
        }
        
        .turn-status {
            background: #0a2a1a;
            border-radius: 10px;
            padding: 8px;
            margin: 8px 0;
            font-size: 11px;
            text-align: center;
            color: #2ed573;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e2a;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff6b6b;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📻 WALKIE TEXTO</h1>
    <div class="subtitulo">💬 Mensajes grandes | 🔊 Sonido al recibir | 🌍 4G/WiFi</div>
    
    <input type="text" id="username" placeholder="Tu nombre (ej: Ana, Juan, Pedro)" autocomplete="off">
    <div class="id-box" id="myId">📱 Esperando nombre...</div>
    
    <input type="text" id="otherId" placeholder="ID de la otra persona" autocomplete="off">
    
    <div class="conexion-info">
        <button id="connect">🔗 CONECTAR</button>
        <button id="resetBtn" class="reset-btn">🔄 RESET</button>
    </div>
    
    <div class="estado-conexion" id="estadoConexion">⚪ Desconectado</div>
    <div class="turn-status" id="turnStatus">🌍 Iniciando...</div>
    
    <!-- CHAT -->
    <div class="chat-container">
        <div class="chat-header">💬 MENSAJES</div>
        <div class="chat-mensajes" id="chatMensajes">
            <div class="mensaje mensaje-info">🔗 Conéctate para empezar a chatear</div>
        </div>
        
        <div class="input-area">
            <textarea id="mensajeInput" placeholder="Escribe tu mensaje... (Enter para enviar)"></textarea>
            <button id="enviarBtn">📤</button>
        </div>
    </div>
    
    <div class="info-wav" id="infoWav">
        🔊 Al recibir un mensaje, sonará sonido.wav<br>
        📁 Cargando sonido.wav...
    </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
    // ============================================
    // WALKIE TEXTO - CON STUN/TURN
    // ============================================
    
    let peer = null;
    let connected = false;
    let miNombre = '';
    let miNombreReal = '';
    let otroNombre = '';
    let dataConnection = null;
    let wavBuffer = null;
    let wavCargado = false;
    let audioContext = null;
    
    // Configuración STUN/TURN
    const peerConfig = {
        host: '0.peerjs.com',
        port: 443,
        secure: true,
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
                { urls: 'stun:stun.stunprotocol.org:3478' },
                {
                    urls: 'turn:turn.anyfirewall.com:443?transport=tcp',
                    username: 'webrtc',
                    credential: 'webrtc'
                },
                {
                    urls: 'turn:turn.anyfirewall.com:80?transport=udp',
                    username: 'webrtc',
                    credential: 'webrtc'
                }
            ],
            iceCandidatePoolSize: 10,
            iceTransportPolicy: 'all'
        }
    };
    
    // DOM
    const usernameInput = document.getElementById('username');
    const myIdDiv = document.getElementById('myId');
    const otherIdInput = document.getElementById('otherId');
    const connectBtn = document.getElementById('connect');
    const resetBtn = document.getElementById('resetBtn');
    const enviarBtn = document.getElementById('enviarBtn');
    const mensajeInput = document.getElementById('mensajeInput');
    const chatMensajes = document.getElementById('chatMensajes');
    const infoWav = document.getElementById('infoWav');
    const estadoConexion = document.getElementById('estadoConexion');
    const turnStatus = document.getElementById('turnStatus');
    
    // ========== CHAT ==========
    function agregarMensaje(texto, tipo, nombre = null, hora = null) {
        const mensajeDiv = document.createElement('div');
        mensajeDiv.className = `mensaje mensaje-${tipo}`;
        
        const now = hora || new Date();
        const horaStr = typeof now === 'string' ? now : now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        
        if (tipo === 'propio') {
            mensajeDiv.innerHTML = `<div class="mensaje-nombre">📤 Yo</div><div>${escapeHtml(texto)}</div><div class="mensaje-hora">${horaStr}</div>`;
        } else if (tipo === 'otro') {
            mensajeDiv.innerHTML = `<div class="mensaje-nombre">📥 ${escapeHtml(nombre || otroNombre)}</div><div>${escapeHtml(texto)}</div><div class="mensaje-hora">${horaStr}</div>`;
        } else if (tipo === 'error') {
            mensajeDiv.innerHTML = `<div>❌ ${escapeHtml(texto)}</div>`;
            mensajeDiv.className = 'mensaje mensaje-error';
        } else {
            mensajeDiv.innerHTML = `<div>${escapeHtml(texto)}</div>`;
        }
        
        chatMensajes.appendChild(mensajeDiv);
        mensajeDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
        
        while (chatMensajes.children.length > 150) {
            chatMensajes.removeChild(chatMensajes.firstChild);
        }
    }
    
    function escapeHtml(texto) {
        const div = document.createElement('div');
        div.textContent = texto;
        return div.innerHTML;
    }
    
    function actualizarEstadoConexion(texto, conectado = false) {
        estadoConexion.innerHTML = texto;
        estadoConexion.style.color = conectado ? '#2ed573' : '#ffb347';
    }
    
    // ========== SONIDO ==========
    async function reproducirSonidoWav() {
        if (!wavCargado || !wavBuffer) return;
        try {
            if (!audioContext || audioContext.state === 'closed') {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            const source = audioContext.createBufferSource();
            source.buffer = wavBuffer;
            source.connect(audioContext.destination);
            source.start();
        } catch(e) { console.log('Error sonido:', e); }
    }
    
    async function cargarWavFijo() {
        try {
            infoWav.innerHTML = '📁 Cargando sonido.wav...';
            const response = await fetch('sonido.wav');
            if (!response.ok) throw new Error('No encontrado');
            const arrayBuffer = await response.arrayBuffer();
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            wavBuffer = await audioContext.decodeAudioData(arrayBuffer);
            wavCargado = true;
            infoWav.innerHTML = `✅ sonido.wav listo 🔊 Al recibir mensaje, sonará`;
        } catch(err) {
            infoWav.innerHTML = `⚠️ No hay sonido.wav (el chat igual funciona)`;
            wavCargado = false;
        }
    }
    
    // ========== ENVIAR MENSAJE ==========
    function enviarMensaje() {
        const texto = mensajeInput.value.trim();
        if (!texto) return;
        if (!connected || !dataConnection || dataConnection.readyState !== 'open') {
            agregarMensaje('No estás conectado', 'error');
            return;
        }
        
        const now = new Date();
        const mensaje = {
            tipo: 'mensaje',
            texto: texto,
            nombre: miNombreReal,
            hora: now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })
        };
        
        dataConnection.send(mensaje);
        agregarMensaje(texto, 'propio', miNombreReal, now);
        mensajeInput.value = '';
        mensajeInput.focus();
    }
    
    // ========== CONEXIÓN ==========
    function conectarConNombreUnico(nombreBase, intento = 1) {
        const nombreIntento = intento === 1 ? nombreBase : `${nombreBase}${intento}`;
        
        if (!nombreBase || nombreBase.trim() === '') {
            agregarMensaje('❌ Escribe un nombre válido', 'error');
            return;
        }
        
        agregarMensaje(`🔄 Conectando como "${nombreIntento}"...`, 'info');
        turnStatus.innerHTML = `🌍 Conectando con STUN/TURN...`;
        
        const nuevoPeer = new Peer(nombreIntento, peerConfig);
        
        nuevoPeer.on('open', id => {
            if (peer) peer.destroy();
            peer = nuevoPeer;
            miNombreReal = id;
            myIdDiv.innerHTML = `📱 TU ID: ${miNombreReal}`;
            actualizarEstadoConexion(`✅ Conectado como "${miNombreReal}"`, false);
            agregarMensaje(`✅ Conectado con ID: ${miNombreReal}`, 'info');
            turnStatus.innerHTML = `✅ Conectado al servidor`;
            
            peer.on('connection', conn => {
                otroNombre = conn.peer;
                configurarDataConnection(conn);
                agregarMensaje(`📞 Conectado con ${otroNombre}`, 'info');
                turnStatus.innerHTML = `🔗 Conectado con ${otroNombre}`;
            });
            
            if (otroNombre) conectarAlOtro();
        });
        
        nuevoPeer.on('error', err => {
            console.error('Peer error:', err);
            if (err.type === 'unavailable-id') {
                turnStatus.innerHTML = `⚠️ "${nombreIntento}" ocupado, probando...`;
                conectarConNombreUnico(nombreBase, intento + 1);
            } else {
                agregarMensaje(`Error: ${err.message}`, 'error');
                turnStatus.innerHTML = `❌ Error: ${err.message}`;
            }
        });
        
        nuevoPeer.on('disconnected', () => {
            turnStatus.innerHTML = `⚠️ Desconectado, reconectando...`;
            nuevoPeer.reconnect();
        });
    }
    
    function conectarAlOtro() {
        if (!otroNombre || !peer || !peer.open) return;
        if (dataConnection && dataConnection.open) return;
        
        agregarMensaje(`🔗 Conectando a "${otroNombre}"...`, 'info');
        turnStatus.innerHTML = `🔗 Llamando a ${otroNombre}...`;
        const conn = peer.connect(otroNombre);
        configurarDataConnection(conn);
    }
    
    function configurarDataConnection(conn) {
        dataConnection = conn;
        
        conn.on('open', () => {
            connected = true;
            actualizarEstadoConexion(`✅ Conectado con "${otroNombre}"`, true);
            agregarMensaje(`✅ ¡Conectado! Puedes enviar mensajes`, 'info');
            turnStatus.innerHTML = `✅ Comunicación establecida`;
        });
        
        conn.on('data', async (data) => {
            if (data.tipo === 'mensaje') {
                agregarMensaje(data.texto, 'otro', data.nombre, data.hora);
                if (wavCargado) await reproducirSonidoWav();
            }
        });
        
        conn.on('close', () => {
            connected = false;
            dataConnection = null;
            actualizarEstadoConexion('❌ Desconectado', false);
            agregarMensaje('❌ Desconectado del otro walkie', 'info');
            turnStatus.innerHTML = `⚠️ Desconectado`;
        });
        
        conn.on('error', (err) => {
            console.error('Connection error:', err);
            agregarMensaje(`Error: ${err.message}`, 'error');
        });
    }
    
    function resetCompleto() {
        if (dataConnection) dataConnection.close();
        if (peer) peer.destroy();
        connected = false;
        dataConnection = null;
        otroNombre = '';
        chatMensajes.innerHTML = '<div class="mensaje mensaje-info">🔄 Reiniciado. Conecta de nuevo.</div>';
        actualizarEstadoConexion('⚪ Desconectado', false);
        turnStatus.innerHTML = `🌍 Reiniciando...`;
        if (miNombre) setTimeout(() => conectarConNombreUnico(miNombre, 1), 500);
    }
    
    // ========== UI ==========
    connectBtn.onclick = () => {
        const nombre = usernameInput.value.trim();
        const otro = otherIdInput.value.trim();
        if (!nombre) { alert('Escribe tu nombre'); return; }
        if (!otro) { alert('Escribe el nombre del otro'); return; }
        miNombre = nombre;
        otroNombre = otro;
        conectarConNombreUnico(miNombre, 1);
        setTimeout(() => conectarAlOtro(), 1500);
    };
    
    resetBtn.onclick = () => resetCompleto();
    enviarBtn.onclick = () => enviarMensaje();
    
    mensajeInput.onkeypress = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            enviarMensaje();
        }
    };
    
    // ========== INICIAR ==========
    cargarWavFijo();
    usernameInput.value = '';
    turnStatus.innerHTML = `🌍 Iniciando con STUN/TURN...`;
</script>
</body>
</html>
