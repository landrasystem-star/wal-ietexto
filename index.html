<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Walkie Texto - Mensajes con Sonido</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0a0f;
            font-family: system-ui, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: #2c2c3e;
            border-radius: 40px;
            padding: 25px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h1 {
            color: #ff6b6b;
            text-align: center;
            margin: 0 0 5px;
            font-size: 1.8rem;
        }

        .subtitulo {
            text-align: center;
            color: #ffb347;
            font-size: 0.75rem;
            margin-bottom: 20px;
        }

        input, button {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 16px;
            border: none;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input {
            background: #0a0a0f;
            border: 1px solid #3a3a4a;
            color: white;
            text-align: center;
        }

        button {
            background: #ff6b6b;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .id-box {
            background: #0a0a0f;
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            margin: 10px 0;
            word-break: break-all;
            color: #2ed573;
            font-size: 13px;
            font-weight: bold;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: #aaa;
            font-size: 0.85rem;
            background: #1e1e2a;
            padding: 8px;
            border-radius: 20px;
        }

        .reset-btn {
            background: #7f8c8d;
        }

        .conexion-info {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }

        .conexion-info button {
            flex: 1;
            margin: 0;
        }

        /* CHAT - LETRAS GRANDES */
        .chat-container {
            background: #1e1e2a;
            border-radius: 24px;
            margin: 15px 0;
            overflow: hidden;
        }

        .chat-header {
            background: #0a0a0f;
            padding: 12px 15px;
            border-bottom: 1px solid #3a3a4a;
            color: #ffb347;
            font-size: 0.9rem;
            text-align: center;
            font-weight: bold;
        }

        .chat-mensajes {
            height: 380px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* MENSAJES GRANDES */
        .mensaje {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 1.15rem;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .mensaje-propio {
            background: #ff6b6b;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }

        .mensaje-otro {
            background: #3498db;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
        }

        .mensaje-info {
            background: #7f8c8d;
            color: white;
            align-self: center;
            font-size: 0.85rem;
            padding: 8px 14px;
            border-radius: 20px;
        }

        .mensaje-error {
            background: #e74c3c;
            color: white;
            align-self: center;
            font-size: 0.85rem;
            padding: 8px 14px;
            border-radius: 20px;
        }

        .mensaje-nombre {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .mensaje-hora {
            font-size: 0.7rem;
            opacity: 0.8;
            margin-top: 5px;
            text-align: right;
        }

        /* AREA DE TEXTO GRANDE */
        .input-area {
            display: flex;
            gap: 12px;
            padding: 15px;
            border-top: 1px solid #3a3a4a;
        }

        .input-area textarea {
            flex: 1;
            margin: 0;
            padding: 14px;
            background: #0a0a0f;
            border: 1px solid #3a3a4a;
            border-radius: 20px;
            color: white;
            font-size: 1.15rem;
            resize: none;
            font-family: system-ui;
            height: 60px;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: #2ed573;
        }

        .input-area button {
            width: 75px;
            margin: 0;
            background: #2ed573;
            font-size: 1.3rem;
            border-radius: 20px;
        }

        .info-wav {
            background: #0a0a0f;
            border-radius: 12px;
            padding: 10px;
            margin-top: 12px;
            font-size: 11px;
            text-align: center;
            color: #ffb347;
        }

        .spinner {
            display: none;
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            background: #2c3e50;
            border-radius: 20px;
            color: white;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1e2a;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff6b6b;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📻 WALKIE TEXTO</h1>
    <div class="subtitulo">💬 Mensajes | 🔊 Sonido al recibir | 🔇 Sin micrófono</div>
    
    <input type="text" id="username" placeholder="Tu nombre">
    <div class="id-box" id="myId">Esperando ID...</div>
    
    <input type="text" id="otherId" placeholder="ID de la otra persona">
    
    <div class="conexion-info">
        <button id="connect">🔗 CONECTAR</button>
        <button id="resetBtn" class="reset-btn">🔄 RESET</button>
    </div>
    
    <!-- CHAT -->
    <div class="chat-container">
        <div class="chat-header">💬 CHAT - Letras grandes</div>
        <div class="chat-mensajes" id="chatMensajes">
            <div class="mensaje mensaje-info">🔗 Conéctate para empezar a chatear</div>
        </div>
        
        <div class="input-area">
            <textarea id="mensajeInput" placeholder="Escribe tu mensaje... (Enter para enviar)"></textarea>
            <button id="enviarBtn">📤</button>
        </div>
    </div>
    
    <div class="info-wav" id="infoWav">
        💡 Cargando sonido.wav...<br>
        🔊 Al recibir un mensaje, sonará automáticamente
    </div>
    
    <div class="status" id="status">📡 Desconectado</div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
    // ============================================
    // WALKIE TEXTO - basado en código que funciona
    // ============================================
    
    let peer = null;
    let dataConnection = null;
    let connected = false;
    let miNombre = '';
    let otroId = '';
    
    // Sonido
    let audioContext = null;
    let wavBuffer = null;
    let wavCargado = false;
    
    // DOM
    const usernameInput = document.getElementById('username');
    const myIdDiv = document.getElementById('myId');
    const otherIdInput = document.getElementById('otherId');
    const connectBtn = document.getElementById('connect');
    const resetBtn = document.getElementById('resetBtn');
    const enviarBtn = document.getElementById('enviarBtn');
    const mensajeInput = document.getElementById('mensajeInput');
    const chatMensajes = document.getElementById('chatMensajes');
    const statusSpan = document.getElementById('status');
    const infoWav = document.getElementById('infoWav');
    
    function mostrarMensaje(texto, esError = false) {
        statusSpan.innerHTML = texto;
        if (esError) {
            setTimeout(() => {
                if (connected) statusSpan.innerHTML = '✅ Conectado';
                else statusSpan.innerHTML = '📡 Desconectado';
            }, 3000);
        }
    }
    
    // ========== CHAT ==========
    function agregarMensaje(texto, tipo, nombre = null, hora = null) {
        const mensajeDiv = document.createElement('div');
        mensajeDiv.className = `mensaje mensaje-${tipo}`;
        
        const now = hora || new Date();
        const horaStr = typeof now === 'string' ? now : now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        
        if (tipo === 'propio') {
            mensajeDiv.innerHTML = `<div class="mensaje-nombre">📤 Yo</div><div>${escapeHtml(texto)}</div><div class="mensaje-hora">${horaStr}</div>`;
        } else if (tipo === 'otro') {
            mensajeDiv.innerHTML = `<div class="mensaje-nombre">📥 ${escapeHtml(nombre || 'Otro')}</div><div>${escapeHtml(texto)}</div><div class="mensaje-hora">${horaStr}</div>`;
        } else if (tipo === 'error') {
            mensajeDiv.innerHTML = `<div>❌ ${escapeHtml(texto)}</div>`;
            mensajeDiv.className = 'mensaje mensaje-error';
        } else {
            mensajeDiv.innerHTML = `<div>${escapeHtml(texto)}</div>`;
        }
        
        chatMensajes.appendChild(mensajeDiv);
        mensajeDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
        
        while (chatMensajes.children.length > 150) {
            chatMensajes.removeChild(chatMensajes.firstChild);
        }
    }
    
    function escapeHtml(texto) {
        const div = document.createElement('div');
        div.textContent = texto;
        return div.innerHTML;
    }
    
    // ========== CARGAR sonido.wav ==========
    async function cargarWavFijo() {
        try {
            infoWav.innerHTML = '📁 Cargando sonido.wav...';
            const response = await fetch('sonido.wav');
            if (!response.ok) {
                throw new Error('No se encontró sonido.wav');
            }
            const arrayBuffer = await response.arrayBuffer();
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            wavBuffer = await audioContext.decodeAudioData(arrayBuffer);
            wavCargado = true;
            const tamañoKB = (arrayBuffer.byteLength / 1024).toFixed(1);
            infoWav.innerHTML = `✅ sonido.wav listo (${tamañoKB} KB)<br>🔊 Al recibir mensaje, sonará automáticamente`;
            return true;
        } catch(err) {
            console.error(err);
            infoWav.innerHTML = `❌ No se encuentra sonido.wav<br>💡 Pon el archivo en la misma carpeta (el chat igual funciona)`;
            wavCargado = false;
            return false;
        }
    }
    
    // ========== REPRODUCIR SONIDO ==========
    async function reproducirSonido() {
        if (!wavCargado || !wavBuffer) return;
        try {
            if (!audioContext || audioContext.state === 'closed') {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            const source = audioContext.createBufferSource();
            source.buffer = wavBuffer;
            source.connect(audioContext.destination);
            source.start();
        } catch(e) {
            console.log('Error reproduciendo sonido:', e);
        }
    }
    
    // ========== ENVIAR MENSAJE ==========
    function enviarMensaje() {
        const texto = mensajeInput.value.trim();
        if (!texto) return;
        if (!connected || !dataConnection || dataConnection.readyState !== 'open') {
            agregarMensaje('No estás conectado al otro walkie', 'error');
            return;
        }
        
        const now = new Date();
        const mensaje = {
            tipo: 'mensaje',
            texto: texto,
            nombre: miNombre,
            hora: now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
            timestamp: now.getTime()
        };
        
        dataConnection.send(mensaje);
        agregarMensaje(texto, 'propio', miNombre, now);
        mensajeInput.value = '';
        mensajeInput.focus();
    }
    
    // ========== RESET ==========
    async function resetCompleto() {
        mostrarMensaje('🔄 Reiniciando conexión...');
        
        if (dataConnection) {
            dataConnection.close();
            dataConnection = null;
        }
        if (peer) {
            peer.destroy();
            peer = null;
        }
        
        connected = false;
        
        // Limpiar chat
        chatMensajes.innerHTML = '<div class="mensaje mensaje-info">🔄 Reiniciado. Conecta de nuevo.</div>';
        
        inicializarPeer();
        mostrarMensaje('✅ Listo para conectar');
    }
    
    // ========== CONFIGURAR DATACHANNEL ==========
    function configurarDataConnection(conn) {
        dataConnection = conn;
        
        conn.on('open', () => {
            connected = true;
            mostrarMensaje('✅ Conectado - Puedes enviar mensajes');
            agregarMensaje(`✅ ¡Conectado con ${otherIdInput.value.trim()}!`, 'info');
        });
        
        conn.on('data', async (data) => {
            if (data.tipo === 'mensaje') {
                agregarMensaje(data.texto, 'otro', data.nombre, data.hora);
                // Reproducir sonido al recibir mensaje
                await reproducirSonido();
            }
        });
        
        conn.on('close', () => {
            connected = false;
            dataConnection = null;
            mostrarMensaje('❌ Desconectado');
            agregarMensaje('❌ Desconectado del otro walkie', 'info');
        });
        
        conn.on('error', (err) => {
            console.error('Error en conexión:', err);
            agregarMensaje(`❌ Error: ${err.message}`, 'error');
        });
    }
    
    // ========== PEERJS ==========
    function inicializarPeer() {
        peer = new Peer({ host: '0.peerjs.com', port: 443, secure: true });
        
        peer.on('open', id => {
            myIdDiv.innerHTML = `📱 TU ID: ${id}<br>📛 ${miNombre || 'Sin nombre'}`;
            mostrarMensaje('✅ Listo. Comparte este ID');
        });
        
        peer.on('connection', conn => {
            agregarMensaje(`📞 Conexión entrante de ${conn.peer}`, 'info');
            configurarDataConnection(conn);
        });
        
        peer.on('error', err => {
            console.error(err);
            mostrarMensaje('❌ Error de conexión', true);
        });
    }
    
    // ========== UI ==========
    
    connectBtn.onclick = () => {
        const otro = otherIdInput.value.trim();
        if (!otro) { 
            alert('Escribe el ID del otro walkie'); 
            return; 
        }
        if (!peer || !peer.open) {
            alert('Esperando conexión al servidor...');
            return;
        }
        
        mostrarMensaje('🔄 Conectando...');
        agregarMensaje(`🔗 Conectando a "${otro}"...`, 'info');
        
        if (dataConnection) {
            dataConnection.close();
            dataConnection = null;
        }
        
        const conn = peer.connect(otro);
        configurarDataConnection(conn);
    };
    
    resetBtn.onclick = async () => {
        await resetCompleto();
    };
    
    usernameInput.onchange = () => {
        miNombre = usernameInput.value.trim();
        if (miNombre && peer && peer.id) {
            myIdDiv.innerHTML = `📱 TU ID: ${peer.id}<br>📛 ${miNombre}`;
        }
    };
    
    enviarBtn.onclick = () => {
        enviarMensaje();
    };
    
    mensajeInput.onkeypress = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            enviarMensaje();
        }
    };
    
    // ========== INICIALIZAR ==========
    inicializarPeer();
    cargarWavFijo();
    
    usernameInput.value = 'usuario';
    miNombre = 'usuario';
    
    window.onbeforeunload = () => {
        if (peer) peer.destroy();
        if (audioContext) audioContext.close();
    };
</script>
</body>
</html>
